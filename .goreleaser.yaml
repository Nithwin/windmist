version: 2

project_name: windmist

builds:
  - id: windmist
    binary: windmist
    main: ./main.go
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/Nithwin/WindMist/cmd.Version={{.Version}}
      - -X github.com/Nithwin/WindMist/cmd.Commit={{.ShortCommit}}
      - -X github.com/Nithwin/WindMist/cmd.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else }}{{ title .Os }}{{ end }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - repository:
      owner: Nithwin
      name: homebrew-tap
    commit_author:
      name: Nithwin
      email: contact@windmist.dev
    homepage: "https://github.com/Nithwin/WindMist"
    description: "AI coding agent for the terminal."
    test: |
      system "#{bin}/windmist", "version"
