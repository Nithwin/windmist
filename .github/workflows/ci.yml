name: CI

on:
  push:
    branches: [ "v2", "main", "master" ]
  pull_request:
    branches: [ "v2", "main", "master" ]

jobs:
  test:
    name: Lint & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22.x']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install dependencies
      run: go mod download

    - name: Verify formatting
      run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi
      if: runner.os == 'Linux'

    - name: Run Tests
      run: go test -v ./...
      
    - name: Build
      run: go build -v ./...
